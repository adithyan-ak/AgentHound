name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.25.13"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Lint and format
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.11.4
      - name: Verify binary dependency boundaries
        run: make deps-check
      - name: Enforce the collector size budget
        run: make size-check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run race-enabled unit tests
        run: go test ./... -short -race -count=1

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/ui/package-lock.json
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Check binary dependency licenses
        run: >-
          go run github.com/google/go-licenses@v1.6.0 check
          --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,Unlicense,Zlib
          ./collector/cmd/agenthound/...
          ./server/cmd/agenthound-server/...
      - name: Check production dashboard dependencies
        working-directory: server/ui
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/ui/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Lint, test, and build the dashboard
        run: make ui-check
      - name: Build both binaries with the real dashboard
        run: |
          mkdir -p bin
          go build -o bin/agenthound ./collector/cmd/agenthound
          go build -o bin/agenthound-server ./server/cmd/agenthound-server
          ./bin/agenthound --version
          ./bin/agenthound-server --version
      - name: Compile canonical release targets
        run: make cross-build

  integration:
    name: Integration (Neo4j ${{ matrix.neo4j_major }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - neo4j_image: neo4j:4.4-community
            neo4j_major: "4"
          - neo4j_image: neo4j:5-community
            neo4j_major: "5"
    services:
      neo4j:
        image: ${{ matrix.neo4j_image }}
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agenthound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      AGENTHOUND_NEO4J_URI: bolt://localhost:7687
      AGENTHOUND_NEO4J_USER: neo4j
      AGENTHOUND_NEO4J_PASSWORD: testpassword
      AGENTHOUND_EXPECTED_NEO4J_MAJOR: ${{ matrix.neo4j_major }}
      AGENTHOUND_PG_URI: postgres://test:test@localhost:5432/agenthound_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run database-backed integrations serially
        run: >-
          go test -race -count=1 -p 1 -run '^TestIntegration'
          ./server/internal/appdb
          ./server/internal/graph
          ./server/internal/analysis/...
          ./server/internal/ingest
      - name: Run storage binding lifecycle on a fresh graph
        env:
          AGENTHOUND_FRESH_DB_INTEGRATION: "1"
        run: >-
          go test ./server/internal/graph -race -count=1 -p 1
          -run '^TestIntegrationStorageBindingLifecycle$'
      - name: Run LiteLLM publication integrations on fresh storage
        env:
          AGENTHOUND_FRESH_DB_INTEGRATION: "1"
        run: >-
          go test ./server/internal/analysis/prebuilt -race -count=1 -p 1
          -run '^TestIntegrationLiteLLM(FingerprintThenCollectPreservesGatewayProperties|FirstPartyProducerSatisfiesMasterExposureQuery|QueryRejectsUnobservedMasterMaterial)$'
      - name: Run fresh-schema publication integrations
        env:
          AGENTHOUND_FRESH_DB_INTEGRATION: "1"
        run: >-
          go test ./server/internal/ingest -race -count=1 -p 1
          -run '^TestIntegrationFreshSchema(CompleteIngestPublishes|EmptyIngestPublishesUnderThreeSeconds)$'

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [unit, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run collector-to-ingest smoke test
        run: make integration

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Exercise native Windows contracts
        run: go test ./sdk/checkpoint ./sdk/contact ./sdk/common ./sdk/rules -count=1

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build collector image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.agenthound
          load: true
          push: false
          tags: agenthound:ci
          build-args: |
            VERSION=ci-test
            COMMIT=ci-test-commit
      - name: Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.agenthound-server
          load: true
          push: false
          tags: agenthound-server:ci
          build-args: |
            VERSION=ci-test
            COMMIT=ci-test-commit
      - name: Build standard image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.standard
          load: true
          push: false
          tags: agenthound-standard:ci
          build-args: |
            VERSION=ci-test
            COMMIT=ci-test-commit
      - name: Verify image version metadata
        run: |
          [[ "$(docker run --rm agenthound:ci --version)" == \
            "agenthound version ci-test (commit: ci-test-commit)" ]]
          [[ "$(docker run --rm agenthound-server:ci --version)" == \
            "agenthound-server version ci-test (commit: ci-test-commit)" ]]
          [[ "$(docker run --rm --entrypoint agenthound agenthound-standard:ci --version)" == \
            "agenthound version ci-test (commit: ci-test-commit)" ]]
          [[ "$(docker run --rm --entrypoint agenthound-server agenthound-standard:ci --version)" == \
            "agenthound-server version ci-test (commit: ci-test-commit)" ]]
