version: 2

builds:
  - id: agenthound
    main: ./collector/cmd/agenthound
    binary: agenthound
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

  - id: agenthound-server
    main: ./server/cmd/agenthound-server
    binary: agenthound-server
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}

archives:
  - id: agenthound
    ids: [agenthound]
    name_template: "agenthound_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides: [{goos: windows, formats: [zip]}]
  - id: agenthound-server
    ids: [agenthound-server]
    name_template: "agenthound-server_{{.Version}}_{{.Os}}_{{.Arch}}"
    format_overrides: [{goos: windows, formats: [zip]}]

checksum:
  name_template: 'checksums.txt'

# Sign the checksums file ONLY (one signature gates all artifacts via the checksums).
# cosign v3 (installed by cosign-installer v4+) dropped --output-signature /
# --output-certificate in favour of a single self-contained bundle. The
# .sigstore.json holds both the signature and the Fulcio certificate; verify
# with: cosign verify-blob --bundle checksums.txt.sigstore.json checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

sboms:
  - artifacts: archive

brews:
  - repository:
      owner: adithyan-ak
      name: homebrew-agenthound
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: true
    ids: [agenthound]
    name: agenthound
    directory: Formula
    description: "Lean field collector for AI agent infrastructure"
    homepage: "https://github.com/adithyan-ak/agenthound"
    install: |
      bin.install "agenthound"
    test: |
      assert_match "agenthound", shell_output("#{bin}/agenthound --version")

  - repository:
      owner: adithyan-ak
      name: homebrew-agenthound
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: true
    ids: [agenthound-server]
    name: agenthound-server
    directory: Formula
    description: "Single-user Neo4j-backed graph and UI for AgentHound"
    homepage: "https://github.com/adithyan-ak/agenthound"
    install: |
      bin.install "agenthound-server"
    test: |
      assert_match "agenthound-server", shell_output("#{bin}/agenthound-server --version")

dockers:
  - id: agenthound
    image_templates:
      - "{{ .Env.AGENTHOUND_IMAGE_REPOSITORY }}:{{ .Version }}-amd64"
    dockerfile: docker/Dockerfile.agenthound
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .Commit }}"
      - "--label=org.opencontainers.image.title=agenthound"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/adithyan-ak/agenthound"
    extra_files: [collector, server, sdk, modules, go.mod, go.sum]
    skip_push: false
    goarch: amd64
  - id: agenthound-arm64
    image_templates:
      - "{{ .Env.AGENTHOUND_IMAGE_REPOSITORY }}:{{ .Version }}-arm64"
    dockerfile: docker/Dockerfile.agenthound
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .Commit }}"
    extra_files: [collector, server, sdk, modules, go.mod, go.sum]
    goarch: arm64
  - id: agenthound-server
    image_templates:
      - "{{ .Env.AGENTHOUND_SERVER_IMAGE_REPOSITORY }}:{{ .Version }}-amd64"
    dockerfile: docker/Dockerfile.agenthound-server
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .Commit }}"
    extra_files: [collector, server, sdk, modules, go.mod, go.sum]
    goarch: amd64
  - id: agenthound-server-arm64
    image_templates:
      - "{{ .Env.AGENTHOUND_SERVER_IMAGE_REPOSITORY }}:{{ .Version }}-arm64"
    dockerfile: docker/Dockerfile.agenthound-server
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=COMMIT={{ .Commit }}"
    extra_files: [collector, server, sdk, modules, go.mod, go.sum]
    goarch: arm64

docker_manifests:
  - name_template: "{{ .Env.AGENTHOUND_IMAGE_REPOSITORY }}:{{ .Version }}"
    image_templates:
      - "{{ .Env.AGENTHOUND_IMAGE_REPOSITORY }}:{{ .Version }}-amd64"
      - "{{ .Env.AGENTHOUND_IMAGE_REPOSITORY }}:{{ .Version }}-arm64"
  - name_template: "{{ .Env.AGENTHOUND_SERVER_IMAGE_REPOSITORY }}:{{ .Version }}"
    image_templates:
      - "{{ .Env.AGENTHOUND_SERVER_IMAGE_REPOSITORY }}:{{ .Version }}-amd64"
      - "{{ .Env.AGENTHOUND_SERVER_IMAGE_REPOSITORY }}:{{ .Version }}-arm64"

release:
  draft: true

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^ci:']
