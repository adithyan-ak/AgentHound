services:
  mcp-streamable:
    build:
      context: ./services/mcp-everything
    command: ["streamableHttp"]
    environment:
      PORT: "3001"
    ports:
      - "127.0.0.1::3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/mcp',{method:'POST'}).then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s

  mcp-bearer-gate:
    build:
      context: ./services/mcp-everything
    entrypoint: ["node", "/opt/mcp-everything/bearer-gate.mjs"]
    environment:
      LISTEN_PORT: "3003"
      UPSTREAM_URL: http://mcp-streamable:3001
      EXPECTED_BEARER_TOKEN: agenthound-smoke-bearer-not-production
      TOOL_RESOURCE_HINT: structure.md
    depends_on:
      mcp-streamable:
        condition: service_healthy
    ports:
      - "127.0.0.1::3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/healthz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  postgres:
    image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: agenthound
      POSTGRES_USER: agenthound
      POSTGRES_PASSWORD: agenthound-smoke
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d agenthound -U agenthound"]
      interval: 2s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:4.4-community@sha256:b0efe93722d27bc050908810650939380d989b1936fc5dd02ad1d7bf1c87a13b
    environment:
      NEO4J_AUTH: neo4j/agenthound-smoke
    ports:
      - "127.0.0.1::7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p agenthound-smoke 'RETURN 1' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 20s
