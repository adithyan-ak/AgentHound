id: injection-imperative-override
name: Imperative Override in Instructions
description: >
  Detects explicit replacement of the agent's current identity or controlling
  role. Bare test personas and documentation labels are supporting context.
version: 1
enabled: true
scope:
  collector: all
  targets:
    - instruction.content
severity: critical
owasp: [MCP09, ASI07]
tags: [injection, prompt-injection, instruction-poisoning]
matcher:
  type: regex
  pattern: '\b(you\s+are\s+(now|no\s+longer)|from\s+now\s+on(?:\s*,)?\s+(?:you\s+are|pretend\s+you\s+are)|(?:replace|discard)\s+your\s+(?:(?:current|system)\s+)?(?:role|identity|persona)|your\s+new\s+(?:role|identity|persona|instructions))'
  case_insensitive: true
emit:
  finding_type: has_injection_patterns
  labels: [imperative_override]
